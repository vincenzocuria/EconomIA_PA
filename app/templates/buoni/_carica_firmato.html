<form method="post" action="{{ url_for('buoni.carica_firmato', id=b.id) }}"
      enctype="multipart/form-data"
      class="d-flex flex-wrap align-items-center gap-1 mb-0">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  {% if next %}
  <input type="hidden" name="next" value="{{ next }}">
  {% endif %}
  <input type="file" name="allegato_firmato" class="form-control form-control-sm"
         style="max-width:13rem" accept=".pdf,.jpg,.jpeg,.png,.webp,application/pdf,image/*"
         required aria-label="Modulo firmato {{ b|formato_num }}">
  <button type="submit" class="btn btn-sm btn-warning">Carica firmato</button>
</form>
